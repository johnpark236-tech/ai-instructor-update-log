name: Glance v2.4 browser and download verification
on:
  push:
    branches: [feat/glance-benefits-v24]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -X utf8 scripts/build_lessons_index.py
      - run: python -m unittest discover -s automation/codex/tests -v
      - run: python -m unittest discover -s tests -p 'test_glance_v24.py' -v
      - run: node tests/quiz_ui.test.cjs && node tests/prompt_inputs.test.cjs
      - run: npm install --no-save --no-package-lock playwright@1.58.2 pptxgenjs@3.12.0
      - name: Select browser
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
            echo "PLAYWRIGHT_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - run: node tests/glance_v24.browser.cjs
      - run: node scripts/build_downloads.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glance-v24-evidence
          path: |
            docs/reports/glance-v24/*.png
            docs/reports/glance-v24/browser-results.json
            downloads/AI-2026-10-CAT04-019-learner.pptx
            downloads/AI-2026-10-CAT04-019-instructor.pptx
          retention-days: 14
