name: Cloud Codex CLI - hourly AI lesson

on:
  schedule:
    - cron: "35 * * * *" # UTC; minutes remain 35 in KST. GitHub can delay scheduled jobs.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: codex-cloud-hourly-lesson
  cancel-in-progress: false

jobs:
  publish:
    # Never run subscription credentials for forked pull requests.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout trusted main, without GitHub write token
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Codex CLI
        run: |
          npm install --global @openai/codex
          codex --version

      - name: Prepare Linux workspace-write sandbox
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Restore subscription sign-in from GitHub Secret only (no caching)
        shell: bash
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          set -eu
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::error::Missing CODEX_AUTH_JSON Actions secret. See automation/codex/README.md"
            exit 1
          fi
          mkdir -p "$HOME/.codex"
          chmod 700 "$HOME/.codex"
          printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
          chmod 600 "$HOME/.codex/auth.json"
          codex login status

      - name: Codex creates, checks, and independently self-reviews one lesson
        run: |
          python -X utf8 automation/codex/hourly_publish.py \
            --kind lesson --news-repo . --lesson-repo . --no-push

      - name: Show Codex hourly status including quota pause
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, os
          log = pathlib.Path.home()/'.mannal-codex-hourly'/'runs.jsonl'
          result = json.loads(log.read_text(encoding='utf-8').splitlines()[-1])
          status = result['status']
          message = {
            'RATE_LIMITED': '⏸ Codex 구독 한도 소진 — 이번 회차 게시 중단, 다음 매시간 예약에 자동 재시도',
            'SKIPPED': 'ℹ 검증된 신규 주제 없음 — 게시 생략, 다음 예약 정상 유지',
            'COMMITTED': '✅ 자체 검수 승인 및 커밋 — 게시 단계로 진행',
            'PUSHED': '✅ GitHub 업로드',
          }.get(status, status)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## AI 교안 발행 실행 결과\\n\\n' + message + '\\n\\n')
          print('::notice::' + message)
          PY

      - name: Privileged Git push and explicit Pages deployment trigger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
            echo "No verified new lesson. No commit to push."
            exit 0
          fi
          # GITHUB_TOKEN-made pushes do NOT fire further push-triggered workflows.
          # Explicitly dispatch Pages after publishing.
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push origin HEAD:main
          gh workflow run pages.yml --ref main
          echo "Published new lesson commit and requested GitHub Pages deployment."

      - name: Always remove ephemeral CLI login
        if: always()
        shell: bash
        run: rm -f "$HOME/.codex/auth.json"
