name: Deploy AI Daily to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "*.js"
      - "*.json"
      - "lessons/**"
      - "vendor/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify common quiz user experience
        run: node tests/quiz_ui.test.cjs
      - name: Verify actual prompt input destinations
        run: node tests/prompt_inputs.test.cjs
      - name: Build lesson downloads (PPT, prompts)
        run: |
          npm install --no-save --no-package-lock pptxgenjs@3.12.0
          node scripts/build_downloads.js
          rm -rf node_modules
      - name: Configure optional cookie-less analytics
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
        run: |
          python - <<'PY'
          import os, re, json, pathlib
          code = os.environ.get("GOATCOUNTER_CODE","").strip()
          if code and not re.fullmatch(r"[a-z0-9][a-z0-9-]{1,62}", code):
              raise SystemExit("Invalid GOATCOUNTER_CODE repository variable")
          pathlib.Path("analytics-config.js").write_text(
              "window.MANNAL_GOATCOUNTER_CODE = " + json.dumps(code) + ";\n",
              encoding="utf-8")
          print("Analytics collection configured" if code else "Analytics disabled until setup")
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

