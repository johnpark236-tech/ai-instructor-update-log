name: Deploy AI Daily to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "*.js"
      - "*.json"
      - "lessons/**"
      - "vendor/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build lesson downloads (PPT, prompts)
        run: |
          npm install --no-save --no-package-lock pptxgenjs@3.12.0
          node scripts/build_downloads.js
          rm -rf node_modules
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
