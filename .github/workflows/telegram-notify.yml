name: Telegram 교안 알림

on:
  push:
    branches: ["main"]
    paths:
      - "lessons/*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/notify_telegram.py --latest
            exit $?
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            FILES=$(git diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD -- 'lessons/*.json')
          else
            FILES=$(git diff --name-only --diff-filter=A "$BEFORE" HEAD -- 'lessons/*.json')
          fi
          if [ -z "$FILES" ]; then
            echo "새 교안 없음"
            exit 0
          fi
          python3 scripts/notify_telegram.py $FILES
