<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Daily TOP10</title>
<style>
:root{--bg:#07111f;--p:#0e1b2e;--l:#203552;--t:#edf5ff;--m:#91a6c2;--a:#6ee7ff;--b:#9d8cff;--g:#70e1a1}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#0d2941 0,transparent 34%),var(--bg);color:var(--t);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.w{width:min(1180px,94%);margin:auto}header{position:sticky;top:0;z-index:3;background:#07111fdd;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff12}.nav{display:flex;justify-content:space-between;align-items:center;padding:14px 0}.brand{font-weight:900}.live{font-size:12px;color:#b8cae1}.hero{padding:62px 0 28px}.ey{font-size:12px;color:var(--a);font-weight:800;letter-spacing:.18em}h1{font-size:clamp(38px,7vw,76px);line-height:1;letter-spacing:-.05em;margin:14px 0}.lead{max-width:850px;color:#b7c6da;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:28px 0}.s,.card{background:linear-gradient(180deg,#102039,#0c182a);border:1px solid #ffffff12;border-radius:18px}.s{padding:17px}.s b{display:block;font-size:25px}.s span{font-size:12px;color:var(--m)}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 30px}.tools input{flex:1;min-width:220px;background:#0b1728;border:1px solid var(--l);color:white;border-radius:12px;padding:12px}.chip{cursor:pointer;background:#0f2038;color:#bed0e8;border:1px solid #294563;padding:9px 12px;border-radius:999px}.chip.on{border-color:var(--a);color:white}.head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin:34px 0 12px}.head h2{margin:0}.head small{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:17px}.row{display:flex;gap:14px}.rank{font-size:26px;color:#6682a6;font-weight:900}.name{font-weight:850;font-size:17px}.badge{font-size:10px;padding:3px 7px;border:1px solid #3a5473;border-radius:999px;margin-left:7px;color:#bdd0e7}.score{float:right;color:var(--g);font-size:12px;font-weight:800}.desc{color:#c0cde0;line-height:1.55;font-size:14px;margin:8px 0}.meta{font-size:11px;color:#7f96b4;display:flex;gap:10px;flex-wrap:wrap}.src{display:inline-block;margin-top:9px;color:#9fe9ff;font-size:12px}.empty{padding:28px;border:1px dashed #34516f;border-radius:16px;color:var(--m);text-align:center}footer{padding:55px 0;color:#6f87a6;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head><body>
<header><div class="w nav"><div class="brand">AI DAILY TOP10</div><div class="live">매일 06:00 KST 자동 갱신</div></div></header>
<main class="w"><section class="hero"><div class="ey">DAILY AI INTELLIGENCE REVIEW</div><h1>신생 AI와 신규 기능을<br>영역별 TOP 10으로.</h1><p class="lead">추론·이미지·영상·음성·코딩·에이전트·검색/리서치 AI의 최신 발표와 신규 기능을 매일 조사해 실사용 가치 중심으로 정리합니다.</p><div class="stats"><div class="s"><b id="n">70</b><span>추적 AI</span></div><div class="s"><b id="c">7</b><span>분석 영역</span></div><div class="s"><b id="u">-</b><span>신규/업데이트</span></div><div class="s"><b>06:00</b><span>매일 KST</span></div></div></section><div class="tools"><input id="q" placeholder="AI 이름·회사·기능 검색"><button class="chip on" data-k="all">전체</button><button class="chip" data-k="추론">추론</button><button class="chip" data-k="이미지">이미지</button><button class="chip" data-k="영상">영상</button><button class="chip" data-k="음성">음성</button><button class="chip" data-k="코딩">코딩</button><button class="chip" data-k="에이전트">에이전트</button><button class="chip" data-k="리서치">리서치</button></div><div id="app"></div></main>
<footer class="w">평가 기준: 최근 발표·업데이트 35% · 성능/품질 25% · 실사용성 20% · 접근성/가격 10% · 생태계/확장성 10%</footer>
<script>
let D={updated_at:'첫 자동 갱신 대기',categories:[]},F='all';const app=document.querySelector('#app'),q=document.querySelector('#q');
function render(){app.innerHTML='';let cnt=0,chg=0;for(const cat of D.categories||[]){if(F!=='all'&&cat.key!==F)continue;const a=(cat.items||[]).filter(x=>!q.value||JSON.stringify(x).toLowerCase().includes(q.value.toLowerCase()));if(!a.length)continue;const s=document.createElement('section');s.innerHTML=`<div class="head"><div><h2>${cat.title}</h2><small>오늘의 변화 가치 기준 TOP 10</small></div><small>${D.updated_at||''}</small></div><div class="grid"></div>`;const g=s.querySelector('.grid');a.forEach((x,i)=>{cnt++;if(x.status==='new'||x.status==='update')chg++;const e=document.createElement('article');e.className='card';e.innerHTML=`<div class="row"><div class="rank">${String(i+1).padStart(2,'0')}</div><div style="flex:1"><div><span class="name">${x.name}</span><span class="badge">${x.status||'tracking'}</span><span class="score">${x.score??'-'}점</span></div><div class="desc">${x.summary||''}</div><div class="meta">${x.company?`<span>${x.company}</span>`:''}${x.released?`<span>발표 ${x.released}</span>`:''}${x.price?`<span>${x.price}</span>`:''}${x.best_for?`<span>추천 ${x.best_for}</span>`:''}</div>${x.url?`<a class="src" href="${x.url}" target="_blank" rel="noopener">근거 링크 ↗</a>`:''}</div></div>`;g.appendChild(e)});app.appendChild(s)}document.querySelector('#n').textContent=(D.categories||[]).reduce((a,c)=>a+(c.items||[]).length,0)||0;document.querySelector('#c').textContent=(D.categories||[]).length;document.querySelector('#u').textContent=chg;if(!app.children.length)app.innerHTML='<div class="empty">첫 자동 갱신 전입니다. GitHub Actions 실행 후 최신 TOP 10이 표시됩니다.</div>'}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');F=b.dataset.k;render()});q.oninput=render;fetch('./ai-daily.json?'+Date.now()).then(r=>r.json()).then(x=>{D=x;render()}).catch(render);render();
</script></body></html>
