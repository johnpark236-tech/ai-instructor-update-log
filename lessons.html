<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 실습 교안</title>
<style>
:root{--bg:#07111f;--p:#0e1b2e;--l:#203552;--t:#edf5ff;--m:#91a6c2;--a:#6ee7ff;--g:#70e1a1;--w:#ffcf70}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#0d2941 0,transparent 34%),var(--bg);color:var(--t);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.6}
a{color:#9fe9ff}.w{width:min(980px,calc(100% - 32px));margin:auto}
header{position:sticky;top:0;z-index:3;background:#07111fdd;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff12}
.nav{display:flex;justify-content:space-between;align-items:center;padding:14px 0;gap:12px}.brand{font-weight:900}.nav a{font-size:13px;text-decoration:none}
.hero{padding:48px 0 18px}.ey{font-size:12px;color:var(--a);font-weight:800;letter-spacing:.18em}
h1{font-size:clamp(32px,6vw,58px);line-height:1.05;letter-spacing:-.04em;margin:12px 0}.lead{color:#b7c6da;max-width:760px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tools input{flex:1;min-width:200px;background:#0b1728;border:1px solid var(--l);color:#fff;border-radius:12px;padding:11px}
.chip{cursor:pointer;background:#0f2038;color:#bed0e8;border:1px solid #294563;padding:8px 12px;border-radius:999px;font-size:13px}.chip.on{border-color:var(--a);color:#fff}
.card{background:linear-gradient(180deg,#102039,#0c182a);border:1px solid #ffffff12;border-radius:18px;padding:18px;margin-bottom:12px}

.ttl{font-weight:850;font-size:18px}.meta{font-size:12px;color:#7f96b4;display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:11px;padding:2px 8px;border:1px solid #3a5473;border-radius:999px;color:#bdd0e7}.badge.new{border-color:var(--g);color:var(--g)}.badge.update{border-color:var(--a);color:var(--a)}
.desc{color:#c0cde0;font-size:14px;margin:8px 0 0}
h2{font-size:20px;margin:28px 0 10px}ol.steps{list-style:none;padding:0;margin:0;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:16px 16px 16px 58px}ol.steps li:before{content:counter(s);position:absolute;left:16px;top:14px;width:30px;height:30px;border-radius:50%;background:#16304f;color:var(--a);display:grid;place-items:center;font-weight:900}
.do{margin:4px 0}.ex{color:var(--g);font-size:14px}.ex:before{content:"결과 → "}
.sample{background:#0b1728;border:1px solid var(--l);border-radius:12px;padding:12px;font-size:14px;white-space:pre-wrap}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}label.ck input{margin-top:5px;width:18px;height:18px}
ul.plain{margin:0;padding-left:20px}.warn li::marker{color:var(--w)}
details{border-top:1px solid #ffffff12;padding:10px 0}summary{cursor:pointer;font-weight:700}details p{margin:6px 0 0;color:var(--g)}
.back{display:inline-block;margin:24px 0 0;font-size:14px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.dl{cursor:pointer;margin-top:24px;background:linear-gradient(90deg,#0891b2,#6366f1);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:800;font-size:14px}.dl:disabled{opacity:.6;cursor:wait}.tabs{display:flex;gap:8px;margin:6px 0 4px}.tab{cursor:pointer;flex:1;max-width:220px;background:#0b1728;color:#bed0e8;border:1px solid #294563;border-radius:12px;padding:11px;font-size:14px}.tab.on{border-color:var(--a);color:#fff;background:#10243d}.tab b{color:var(--a);margin-left:4px}
.item{position:relative;padding:0}.item .go{display:block;color:inherit;text-decoration:none;padding:18px 18px 52px}.item:hover{border-color:#3a6a90}.no{color:var(--a);font-weight:900;margin-right:8px}
.mk{cursor:pointer;background:#123326;color:var(--g);border:1px solid #2d6b4c;border-radius:10px;padding:7px 12px;font-weight:800;font-size:13px}.item .mk{position:absolute;right:14px;bottom:12px}.mk.undo{background:#1a2638;color:#bed0e8;border-color:#3a5473}.mk.big{display:block;width:100%;margin:28px 0 0;padding:15px;font-size:16px}
.sync{margin:22px 0 0;font-size:12px;color:var(--m)}.linkbtn{background:none;border:0;color:#9fe9ff;text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
.empty{padding:28px;border:1px dashed #34516f;border-radius:16px;color:var(--m);text-align:center}
footer{padding:48px 0;color:#6f87a6;font-size:12px}
@media print{body{background:#fff;color:#000}header,.tools,.tabs,.sync,.mk,.back,.dl,footer{display:none}.card{background:#fff;border-color:#ccc}.ex,details p{color:#060}}
</style>
</head>
<body>
<header><div class="w nav"><div class="brand">AI 실습 교안</div><a href="./index.html">AI DAILY TOP10 →</a></div></header>
<main class="w" id="app"></main>
<footer class="w">매시간 새 AI 기능 하나를 조사해 30분 안에 따라 할 수 있는 교안으로 정리합니다. 모든 교안 하단에 공식 출처가 있습니다.</footer>
<script src="./lesson-pptx.js"></script>
<script>
const app=document.getElementById('app');
const CATS=['전체','추론','이미지','영상','음성','코딩','에이전트','리서치'];
let INDEX={lessons:[]},filter='전체',query='',tab='todo';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const badge=t=>`<span class="badge ${t==='new'?'new':'update'}">${t==='new'?'신규 서비스':'새 기능'}</span>`;
const getDone=()=>store.get('done')||{};
function setDone(id,on){const d=getDone();if(on)d[id]=new Date().toISOString();else delete d[id];store.set('done',d)}
// 오래된 교안부터 순서대로 번호를 붙인다
function ordered(){return [...INDEX.lessons].sort((a,b)=>(a.created_at+a.id).localeCompare(b.created_at+b.id)).map((l,i)=>({...l,no:i+1}))}
function nextTodo(afterId){const d=getDone(),all=ordered(),i=all.findIndex(l=>l.id===afterId);return all.slice(i+1).find(l=>!d[l.id])||all.find(l=>!d[l.id]&&l.id!==afterId)}

function listView(){
  const done=getDone(),all=ordered(),doneN=all.filter(l=>done[l.id]).length,todoN=all.length-doneN;
  const items=all.filter(l=>(tab==='done')===!!done[l.id]).filter(l=>(filter==='전체'||l.category===filter)&&(!query||JSON.stringify(l).toLowerCase().includes(query.toLowerCase())));
  app.innerHTML=`<section class="hero"><div class="ey">HOURLY AI PRACTICE</div><h1>새 AI 기능,<br>바로 따라 하는 교안.</h1>
  <p class="lead">오래된 교안부터 순서대로 배우세요. 다 배운 교안은 <b>완료</b>를 누르면 목록에서 사라지고, 완료 탭에 그대로 보관됩니다.</p></section>
  <div class="tabs"><button class="tab ${tab==='todo'?'on':''}" data-t="todo">학습할 교안 <b>${todoN}</b></button><button class="tab ${tab==='done'?'on':''}" data-t="done">완료 <b>${doneN}</b></button></div>
  <div class="tools"><input id="q" placeholder="AI 이름·기능 검색" value="${esc(query)}">${CATS.map(c=>`<button class="chip ${c===filter?'on':''}" data-c="${c}">${c}</button>`).join('')}</div>
  <div class="list">${items.length?items.map(l=>`<div class="card item"><a class="go" href="#${esc(l.id)}"><div class="ttl"><span class="no">#${l.no}</span>${esc(l.title)}</div>
  <div class="meta">${badge(l.type)}<span>${esc(l.tool)} · ${esc(l.company)}</span><span>${esc(l.category)}</span><span>${esc(l.level)} · ${l.minutes}분</span><span>작성 ${esc(l.created_at)}</span>${done[l.id]?`<span>완료 ${esc(String(done[l.id]).slice(0,10))}</span>`:''}</div>
  <p class="desc">${esc(l.summary)}</p></a>
  ${tab==='done'?`<button class="mk undo" data-id="${esc(l.id)}">↩ 다시 학습하기</button>`:`<button class="mk" data-id="${esc(l.id)}">✓ 완료</button>`}</div>`).join('')
  :`<div class="empty">${tab==='done'?'아직 완료한 교안이 없습니다.':(todoN?'조건에 맞는 교안이 없습니다.':'🎉 모든 교안을 완료했습니다. 새 교안은 매시간 추가됩니다.')}</div>`}</div>
  <div class="sync">완료 기록은 이 기기의 브라우저에 저장됩니다. <button class="linkbtn" id="sync">다른 기기로 완료 기록 옮기기</button></div>`;
  const q=document.getElementById('q');q.oninput=()=>{query=q.value;const p=q.selectionStart;listView();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)};
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.c;listView()});
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;listView()});
  document.querySelectorAll('.mk').forEach(b=>b.onclick=()=>{setDone(b.dataset.id,!b.classList.contains('undo'));listView()});
  document.getElementById('sync').onclick=shareSync;
}

async function shareSync(){
  const ids=Object.keys(getDone());
  const url=location.href.split('#')[0]+'#import='+encodeURIComponent(ids.join(','));
  try{if(navigator.share){await navigator.share({title:'AI 실습 교안 완료 기록',url});return}}catch(e){return}
  try{await navigator.clipboard.writeText(url);alert('링크를 복사했습니다. 다른 기기(휴대폰 등)에서 이 링크를 열면 완료 기록이 합쳐집니다.')}catch(e){prompt('이 링크를 다른 기기에서 여세요',url)}
}
function importSync(raw){
  const ids=decodeURIComponent(raw).split(',').filter(Boolean),d=getDone();let n=0;
  ids.forEach(id=>{if(!d[id]){d[id]=new Date().toISOString();n++}});store.set('done',d);
  history.replaceState(null,'',location.pathname);alert(`완료 기록 ${n}개를 가져왔습니다.`);tab='todo';listView();
}

async function lessonView(id){
  app.innerHTML='<div class="empty">불러오는 중…</div>';
  let L;try{L=await (await fetch(`./lessons/${encodeURIComponent(id)}.json?${Date.now()}`)).json()}catch(e){app.innerHTML='<div class="empty">교안을 찾을 수 없습니다. <a href="#">목록으로</a></div>';return}
  const key='ck:'+L.id,ck=store.get(key)||[],meta=ordered().find(l=>l.id===L.id),isDone=!!getDone()[L.id];
  const doneBtn=isDone?`<button class="mk big undo" type="button">↩ 완료 취소 (다시 목록에 표시)</button>`:`<button class="mk big" type="button">✓ 학습 완료 — 목록에서 숨기고 다음 교안으로</button>`;
  app.innerHTML=`<div class="bar"><a class="back" href="#">← 교안 목록</a><button class="dl" type="button">⬇ PPT로 다운로드</button></div>
  <section class="hero" style="padding-top:20px"><div class="ey">${meta?`#${meta.no} · `:''}${esc(L.category)} · ${esc(L.tool)}${isDone?' · ✅ 완료한 교안':''}</div><h1 style="font-size:clamp(26px,4.5vw,42px)">${esc(L.title)}</h1>
  <div class="meta">${badge(L.type)}<span>${esc(L.company)}</span><span>${esc(L.level)} · 약 ${L.minutes}분</span><span>발표 ${esc(L.released)}</span><span>작성 ${esc(L.created_at)}</span></div>
  <p class="lead">${esc(L.summary)}</p></section>
  <div class="card"><b>왜 지금 배우나</b><p class="desc">${esc(L.why)}</p></div>
  <h2>준비물</h2><div class="card"><ul class="plain">${L.prerequisites.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>
  <h2>따라 하기</h2><ol class="steps">${L.steps.map(s=>`<li class="card"><b>${esc(s.title)}</b><p class="do">${esc(s.do)}</p><div class="ex">${esc(s.expect)}</div></li>`).join('')}</ol>
  <h2>실습 과제</h2><div class="card"><p style="margin-top:0">${esc(L.practice.task)}</p>${L.practice.sample_input?`<div class="sample">${esc(L.practice.sample_input)}</div>`:''}
  <div style="margin-top:12px">${L.practice.checklist.map((c,i)=>`<label class="ck"><input type="checkbox" data-i="${i}" ${ck[i]?'checked':''}><span>${esc(c)}</span></label>`).join('')}</div></div>
  ${L.teaching_tips.length?`<h2>수업에 쓸 때</h2><div class="card"><ul class="plain">${L.teaching_tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:''}
  <h2>주의할 점</h2><div class="card"><ul class="plain warn">${L.pitfalls.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
  <h2>확인 퀴즈</h2><div class="card">${L.quiz.map(q=>`<details><summary>${esc(q.q)}</summary><p>${esc(q.a)}</p></details>`).join('')}</div>
  <h2>출처</h2><div class="card"><ul class="plain">${L.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('')}</ul></div>
  ${doneBtn}
  <div class="bar"><a class="back" href="#">← 교안 목록</a><button class="dl" type="button">⬇ PPT로 다운로드</button></div>`;
  app.querySelectorAll('label.ck input').forEach(b=>b.onchange=()=>store.set(key,[...app.querySelectorAll('label.ck input')].map(x=>x.checked)));
  app.querySelectorAll('.dl').forEach(b=>b.onclick=()=>window.downloadLessonPptx(L,b));
  app.querySelector('.mk.big').onclick=()=>{
    if(isDone){setDone(L.id,false);lessonView(L.id);return}
    setDone(L.id,true);const n=nextTodo(L.id);
    if(n){location.hash=n.id}else{tab='todo';location.hash='';listView();window.scrollTo(0,0)}
  };
  window.scrollTo(0,0);
}

function route(){const h=location.hash.slice(1);if(h.startsWith('import='))return importSync(h.slice(7));const id=decodeURIComponent(h);id?lessonView(id):listView()}
window.addEventListener('hashchange',route);
fetch('./lessons.json?'+Date.now()).then(r=>r.json()).then(x=>{INDEX=x;route()}).catch(()=>{route()});
</script>
</body>
</html>
